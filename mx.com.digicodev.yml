app-id: mx.com.digicodev.ArcanumDev
runtime: org.freedesktop.Platform
runtime-version: "22.08"
sdk: org.freedesktop.Sdk
command: arcanumdev
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
modules:
  - name: arcanumdev
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - mkdir -p ArcanumDev
      - tar -xf ArcanumDev-Linux-Portable.tar.gz -C ArcanumDev
      - cp -r ArcanumDev /app/
      - chmod +x /app/ArcanumDev/arcanumdev
      - mkdir -p /app/bin
      - ln -s /app/ArcanumDev/arcanumdev /app/bin/arcanumdev
      - install -Dm644 mx.com.digicodev.ArcanumDev.metainfo.xml  -t /app/share/metainfo/
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/mx.com.digicodev.ArcanumDev.svg
      - install -Dm644 mx.com.digicodev.ArcanumDev.desktop -t /app/share/applications/
    sources:
      - type: file
        path: mx.com.digicodev.ArcanumDev.metainfo.xml
      - type: file
        path: mx.com.digicodev.ArcanumDev.desktop
      - type: file
        path: icon.svg
      - type: file
        path: ArcanumDev-Linux-Portable.tar.gz
